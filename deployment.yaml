apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-website
  namespace: devops-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-website
  template:
    metadata:
      labels:
        app: devops-website
    spec:
      containers:
      - name: devops-website
        image: YOUR_DOCKERHUB_USERNAME/devops-website:1.0
        ports:
        - containerPort: 5000
        env:
        - name: ENVIRONMENT
          value: production
        - name: APP_VERSION
          value: "1.0"
        readinessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 5000}
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
